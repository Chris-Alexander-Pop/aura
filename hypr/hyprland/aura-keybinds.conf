# Aura / AGS — window toggles, media keys, screenshots (requires aura-session.sh)
# Sourced last from hyprland.conf so these override Caelestia-era binds in keybinds.conf.

bind = Super, P, exec, ags request toggle control-center
bind = Super+Shift, B, exec, ags request toggle module-hub
bind = Super+Shift, D, exec, ags request toggle calendar
bind = Super+Shift, O, exec, ags request toggle dropdown
bind = Super, Space, exec, ags request toggle launcher

# Region screenshot → clipboard
bind = Super+Shift, S, exec, $HOME/.config/ags/scripts/region-screenshot.sh

# Restart Aura shell
bind = Super+Shift, R, exec, $HOME/.config/ags/scripts/aura-restart.sh

# Media keys → Aura sidecar + OSD (overrides wpctl binds in keybinds.conf)
bind = , XF86AudioRaiseVolume, exec, $HOME/.config/ags/scripts/aura-media-key.sh volume-up
bind = , XF86AudioLowerVolume, exec, $HOME/.config/ags/scripts/aura-media-key.sh volume-down
bind = , XF86AudioMute, exec, $HOME/.config/ags/scripts/aura-media-key.sh mute
bind = , XF86AudioMicMute, exec, $HOME/.config/ags/scripts/aura-media-key.sh mic-mute
bind = , XF86MonBrightnessUp, exec, $HOME/.config/ags/scripts/aura-media-key.sh brightness-up
bind = , XF86MonBrightnessDown, exec, $HOME/.config/ags/scripts/aura-media-key.sh brightness-down
