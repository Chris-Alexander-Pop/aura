# Aura session autostart — source from live hyprland.conf (see hypr/README.md).
# Do not duplicate these lines in ~/.config/hypr/hyprland/execs.conf once sourced here.

# Polkit (native Wayland agent — no GTK/GNOME agent)
exec-once = systemctl --user enable --now hyprpolkitagent.service

# Aura AGS shell — if your machine chains HDMI boot before Aura, start aura-session from
# ~/.config/hypr/hyprland/execs.conf instead and leave this line commented.
# exec-once = $HOME/.config/ags/scripts/aura-session.sh

# Notification daemon (Aura sidecar listens on Freedesktop D-Bus)
exec-once = swaync
