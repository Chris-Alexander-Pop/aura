general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(49, 50, 68)
    inner_color = rgb(205, 214, 244)
    font_color = rgb(17, 17, 27)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = Rubik
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(186, 194, 222, 1.0)
    font_size = 14
    font_family = Rubik
    position = 0, -80
    halign = center
    valign = center
}
