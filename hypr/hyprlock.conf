# Aura — hyprlock
# Catppuccin Mocha · Rubik · mauve accent (#cba6f7)
# Palette: crust 11111b · base 1e1e2e · surface0 313244 · surface1 45475a
#          text cdd6f4 · subtext1 bac2de · overlay1 7f849c
#          mauve cba6f7 · green a6e3a1 · red f38ba8

$font        = Rubik
$accent      = rgb(cba6f7)
$accent_dim  = rgb(b48edf)
$text        = rgb(cdd6f4)
$subtext     = rgb(bac2de)
$overlay     = rgb(7f849c)
$surface0    = rgb(313244)
$surface1    = rgb(45475a)
$crust       = rgb(11111b)
$green       = rgb(a6e3a1)
$red         = rgb(f38ba8)

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    # Password (PAM) and fingerprint run in parallel — no mode switch needed.
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = 󰈷  Scan fingerprint to unlock
    fingerprint:present_message = 󱩽  Scanning fingerprint…
    fingerprint:retry_delay = 500
}

# --- Background ---
# Static image, applied to all monitors (hyprlock scales it to each output).
# Swap hypr/hyprlock-bg.png to change the wallpaper; pitch black for now.
# hyprlock's live `screenshot` blur is unusable on this hybrid-GPU laptop
# (Intel CCS dmabuf breaks GPU blur; CPU screencopy swaps R/B → color cast).
background {
    monitor =
    path = /home/user/.config/ags/hypr/hyprlock-bg.png
    color = rgba(000000ff)
    blur_passes = 0
}

# --- Clock ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 112
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# --- Date ---
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# --- Greeting / user ---
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = $overlay
    font_size = 15
    font_family = $font
    position = 0, 62
    halign = center
    valign = center
}

# --- Input field ---
input-field {
    monitor =
    size = 300, 56
    rounding = 28
    outline_thickness = 2
    outer_color = $surface1
    inner_color = $surface0
    font_color = $text
    check_color = $accent
    fail_color = $red
    capslock_color = $accent

    dots_size = 0.26
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <span foreground="##7f849c">Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    hide_input = false

    invert_numlock = false
    swap_font_color = false

    position = 0, -40
    halign = center
    valign = center
}

# --- Unlock methods (static hint) ---
label {
    monitor =
    text = 󰈷 fingerprint  ·  󰌾 password — use either anytime
    color = $overlay
    font_size = 12
    font_family = $font
    position = 0, -108
    halign = center
    valign = center
}

# --- Fingerprint status ---
label {
    monitor =
    text = $FPRINTPROMPT
    color = $accent_dim
    font_size = 14
    font_family = $font
    position = 0, -138
    halign = center
    valign = center
}

# --- Fingerprint error (only when set) ---
label {
    monitor =
    text = $FPRINTFAIL
    color = $red
    font_size = 12
    font_family = $font
    position = 0, -168
    halign = center
    valign = center
}

# --- Lock hint (bottom) ---
label {
    monitor =
    text = 󰌾  Locked
    color = $overlay
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
