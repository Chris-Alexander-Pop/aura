# Host NVIDIA+Intel. Vicinae is Qt/QML on a layer-shell surface.
#
# Mesa pin was for NVIDIA EGL leaving the layer fully transparent on
# Intel eDP (hyprctl layers a:0). Hybrid linux-dmabuf feedback now
# advertises renderer formats (same as Namida/Zen), so try NVIDIA EGL.
#
# QSG_RENDER_LOOP=basic stays. The threaded loop still glitches on
# this compositor. Do not use software QSG: SourceBlendRect is skipped.
#
# Environment= is inherited by apps Vicinae launches (uwsm-app ->
# systemd-run --scope). ~/.local/bin/vicinae-app-launch still strips
# Mesa leftovers and restores NVIDIA for children.
[Service]
UnsetEnvironment=QT_QUICK_BACKEND
Environment=QSG_RHI_BACKEND=opengl
Environment=QSG_RENDER_LOOP=basic
Environment=__GLX_VENDOR_LIBRARY_NAME=nvidia
Environment=__VK_LAYER_NV_optimus=NVIDIA_only
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
