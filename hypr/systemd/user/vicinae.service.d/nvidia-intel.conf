# Host NVIDIA+Intel. Vicinae is Qt/QML on a layer-shell surface.
#
# NVIDIA EGL leaves the layer fully transparent on Intel eDP
# (hyprctl layers a:0). Mesa EGL targets the Intel iGPU instead.
#
# These Environment= lines are inherited by apps Vicinae launches
# (uwsm-app -> systemd-run --scope). Flutter then rasterizes with
# llvmpipe. Launch prefix ~/.local/bin/vicinae-app-launch strips them.
#
# Do not use QT_QUICK_BACKEND=software / QSG_RHI_BACKEND=software.
# Vicinae 0.28 paints list selection with a custom QSG shader
# (SourceBlendRect). The software scene graph skips it, so the
# selected row stays window-gray.
[Service]
UnsetEnvironment=__VK_LAYER_NV_optimus
UnsetEnvironment=QT_QUICK_BACKEND
Environment=QSG_RHI_BACKEND=opengl
Environment=QSG_RENDER_LOOP=basic
Environment=__GLX_VENDOR_LIBRARY_NAME=mesa
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.json
