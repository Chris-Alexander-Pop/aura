# =============================================================================
# Aura Keybinds — hyprland_aura.conf
#
# HOW TO ACTIVATE (pick one — Caelestia/Quickshell unaffected until you opt in):
#
#   A) Full Aura session — add to ~/.config/hypr/hyprland.conf:
#        source = ~/.config/ags/hyprland_aura.conf
#      (or symlink this file into ~/.config/ags/)
#
#   B) Minimal merge — copy only the sections you need (media keys, exec-once,
#      Aura window toggles) into your live hyprland.conf without sourcing all
#      monitor/decoration rules below.
#
# After sourcing, uncomment the two lines in "Aura migration bootstrap":
#   exec-once = swaync          — Freedesktop notification daemon (sidecar listens)
#   source = aura-binds.conf    — Keybinds.* RPC output (create via CC Keybinds pane)
#
# Polkit: at least one agent below must run for privileged package/firewall prompts.
# Keyring: gnome-keyring must unlock at login for stored WiFi/VPN passwords — see
#   docs/roadmap/system-and-input-foundation.md § Login and keyring.
# =============================================================================

# Aura migration bootstrap — uncomment when this file is sourced:
# exec-once = swaync
# source = ~/.config/ags/hypr/aura-binds.conf

# Monitor Scaling for 4K Display
monitor = , preferred, auto, 1.5

# Performance and Stability Optimizations
misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

debug {
    vfr = true
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Disable TrackPoint (red dot)
device {
    name = tpps/2-elan-trackpoint
    enabled = false
}

# ── Auto-start ────────────────────────────────────────────────────────────────
exec-once = valent --gapplication-service
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Nvidia / Wayland fixes ────────────────────────────────────────────────────
windowrule = immediate 0, match:class ^(steam_app_105600)$
cursor {
    no_hardware_cursors = true
}

# ── Shell toggle: Aura ↔ Caelestia ───────────────────────────────────────────
# Super+Shift+A  — kill caelestia / quickshell, launch Aura (in kitty terminal)
bind = Super+Shift, A, exec, ~/.config/ags/aura-launch

# Super+Shift+Q  — kill Aura, relaunch Caelestia  (Super+Shift+C is taken by hyprpicker)
bind = Super+Shift, Q, exec, bash -c 'killall ags gjs ags-sidecar 2>/dev/null; sleep 0.3; caelestia &'

# ── Aura window toggles ───────────────────────────────────────────────────────
# Super+P          → Control Center (normal Hyprland window — tile / close with WM)
bind = Super, P, exec, ags request toggle control-center

# Super+Shift+S    → Region screenshot → clipboard (same chord as Caelestia; script: grim+slurp — not their “freeze” overlay)
bind = Super+Shift, S, exec, $HOME/.config/ags/scripts/region-screenshot.sh

# Super+Shift+B    → Module hub (top-center tile panel)
bind = Super+Shift, B, exec, ags request toggle module-hub

# Super+Shift+D    → Calendar panel
bind = Super+Shift, D, exec, ags request toggle calendar

# Dropdown         → bottom-right L-corner hover (AGS edge triggers)
# Module hub       → top-center hover (AGS edge triggers)

# Bar strip        → always visible on the left (no keybind)

# Launcher (Vicinae) → Super (handled by vicinae separately)

# ── Misc ──────────────────────────────────────────────────────────────────────
bind = Super+Shift, T, exec, ~/.local/bin/toggle_touchscreen.sh

# ── Volume (F-keys / XF86 media keys) — sidecar + OSD ───────────────────────
bind = , XF86AudioRaiseVolume,  exec, $HOME/.config/ags/scripts/aura-media-key.sh volume-up
bind = , XF86AudioLowerVolume,  exec, $HOME/.config/ags/scripts/aura-media-key.sh volume-down
bind = , XF86AudioMute,         exec, $HOME/.config/ags/scripts/aura-media-key.sh mute
bind = , XF86AudioMicMute,      exec, $HOME/.config/ags/scripts/aura-media-key.sh mic-mute

# ── Brightness (F-keys / XF86 media keys) ────────────────────────────────────
bind = , XF86MonBrightnessUp,   exec, $HOME/.config/ags/scripts/aura-media-key.sh brightness-up
bind = , XF86MonBrightnessDown, exec, $HOME/.config/ags/scripts/aura-media-key.sh brightness-down

# ── Launcher ─────────────────────────────────────────────────────────────────
bind = Super, Space, exec, ags request toggle launcher
