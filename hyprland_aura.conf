# =============================================================================
# Aura Keybinds — hyprland_aura.conf
# Include this file from your main hyprland.conf:
#   source = /home/user/Engineering/ags/hyprland_aura.conf
# =============================================================================

# Monitor Scaling for 4K Display
monitor = , preferred, auto, 1.5

# Performance and Stability Optimizations
misc {
    vfr = false
    vrr = 0
    disable_hyprland_logo = true
    background_color = 0x000000
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Disable TrackPoint (red dot)
device {
    name = tpps/2-elan-trackpoint
    enabled = false
}

# ── Auto-start ────────────────────────────────────────────────────────────────
exec-once = valent --gapplication-service
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Nvidia / Wayland fixes ────────────────────────────────────────────────────
windowrule = immediate 0, match:class ^(steam_app_105600)$
cursor {
    no_hardware_cursors = true
}

# ── Shell toggle: Aura ↔ Caelestia ───────────────────────────────────────────
# Super+Shift+A  — kill caelestia / quickshell, launch Aura (in kitty terminal)
bind = Super+Shift, A, exec, ~/.config/ags/aura-launch

# Super+Shift+Q  — kill Aura, relaunch Caelestia  (Super+Shift+C is taken by hyprpicker)
bind = Super+Shift, Q, exec, bash -c 'killall ags gjs ags-sidecar 2>/dev/null; sleep 0.3; caelestia &'

# ── Aura window toggles ───────────────────────────────────────────────────────
# Super+P          → Control Center (normal Hyprland window — tile / close with WM)
bind = Super, P, exec, ags request toggle control-center

# Super+Shift+S    → Region screenshot → clipboard (same chord as Caelestia; script: grim+slurp — not their “freeze” overlay)
bind = Super+Shift, S, exec, $HOME/.config/ags/scripts/region-screenshot.sh

# Super+Shift+B    → Sidebar (layer-shell strip beside the bar)
bind = Super+Shift, B, exec, ags request toggle sidebar

# Super+Shift+D    → Calendar panel
bind = Super+Shift, D, exec, ags request toggle calendar

# Dropdown         → hot corner (mouse to top-center triggers it — handled in AGS)

# Sidebar          → always visible (no keybind needed)

# Launcher (Vicinae) → Super (handled by vicinae separately)

# ── Misc ──────────────────────────────────────────────────────────────────────
bind = Super+Shift, T, exec, ~/.local/bin/toggle_touchscreen.sh

# ── Volume (F-keys / XF86 media keys) ────────────────────────────────────────
bind = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ── Brightness (F-keys / XF86 media keys) ────────────────────────────────────
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
