name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rustc 1.98.0's rust-lld SIGBUS'es (LLVM parallelFor) while linking the
    # many large integration-test binaries on ubuntu-latest. 1.97.1 is the
    # last known-green stable for this gate (2026-08-04). Cap jobs as a
    # secondary guard. Local Arch keeps current stable + LLD via .cargo.
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq lld

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
