name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rustc 1.98 rust-lld SIGBUS'es under parallel integration-test linking.
    # sidecar/.cargo/config.toml pins -fuse-ld=lld for local Arch builds;
    # rewrite that config in CI, force system ld.bfd, serialize jobs, and
    # shrink debuginfo so ubuntu-latest does not run out of disk.
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq binutils

      - uses: dtolnay/rust-toolchain@stable

      - name: Force system bfd linker for CI
        run: |
          mkdir -p sidecar/.cargo
          printf '%s\n' \
            '# CI-only override (see workflow). Avoid rust-lld SIGBUS on GHA.' \
            '[build]' \
            'incremental = false' \
            '' \
            '[target.x86_64-unknown-linux-gnu]' \
            'rustflags = ["-C", "link-self-contained=off", "-C", "link-arg=-fuse-ld=bfd"]' \
            > sidecar/.cargo/config.toml
          cat sidecar/.cargo/config.toml
          df -h /

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
