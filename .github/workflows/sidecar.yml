name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rustc 1.98 defaults to self-contained rust-lld (-B…/gcc-ld -fuse-ld=lld).
    # That rust-lld SIGBUS'es (LLVM parallelFor) linking many large
    # integration-test binaries on ubuntu-latest. Replace sidecar/.cargo's
    # fuse-ld=lld target rustflags, turn self-contained linking off, and
    # force system ld.bfd. Serialize rustc jobs and prune between cargo
    # phases to avoid runner disk exhaustion during parallel test-bin links.
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-self-contained=off -C link-arg=-fuse-ld=bfd"
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq binutils

      - uses: dtolnay/rust-toolchain@stable

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
