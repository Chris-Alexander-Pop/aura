name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # sidecar/.cargo/config.toml forces -fuse-ld=lld for local Arch. On
    # ubuntu-latest, rust-lld (rustc 1.98 self-contained + that flag) SIGBUS
    # while linking many large integration-test bins. Rewrite the cargo
    # config in CI to system ld.bfd and serialize rustc jobs.
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq binutils

      - uses: dtolnay/rust-toolchain@stable

      - name: Use system bfd linker for CI
        run: |
          mkdir -p sidecar/.cargo
          python3 -c 'from pathlib import Path; Path("sidecar/.cargo/config.toml").write_text("# CI-only override (see .github/workflows/sidecar.yml).\n# Do not force LLD: rust-lld SIGBUS'\''es under parallel GHA links.\n[build]\nincremental = false\n\n[target.x86_64-unknown-linux-gnu]\nrustflags = [\n  \"-C\", \"linker-features=-lld\",\n  \"-C\", \"link-arg=-fuse-ld=bfd\",\n]\n", encoding="utf-8")'
          echo "CI cargo linker config:"
          cat sidecar/.cargo/config.toml

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
