name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rustc 1.98 defaults to rust-lld. On ubuntu-latest that has SIGBUS'd while
    # linking many large integration-test binaries in parallel (exit 101).
    # Cap jobs, opt out of rust-lld, shrink debuginfo, and free runner disk so
    # the gate can finish linking without SIGBUS or ENOSPC.
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C linker-features=-lld -C debuginfo=line-tables-only"
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq binutils

      - uses: dtolnay/rust-toolchain@stable

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
