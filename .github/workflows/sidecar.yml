name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rust-lld (self-contained + sidecar/.cargo fuse-ld=lld) SIGBUS'es on
    # ubuntu-latest while linking many large integration-test binaries
    # (LLVM parallelFor), including under rustc 1.97.1. Rewrite cargo
    # config to the system bfd linker and serialize rustc jobs.
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq binutils

      - uses: dtolnay/rust-toolchain@stable

      - name: Force system bfd linker for CI
        run: |
          mkdir -p sidecar/.cargo
          printf '%s\n' \
            '# CI-only override (see workflow). Avoid rust-lld SIGBUS on GHA.' \
            '[build]' \
            'incremental = false' \
            '' \
            '[target.x86_64-unknown-linux-gnu]' \
            'rustflags = ["-C", "link-self-contained=off"]' \
            > sidecar/.cargo/config.toml

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
