name: sidecar

on:
  push:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "scripts/sidecar-test-fast.sh"
      - "scripts/generate-rpc-manifest.sh"
      - "scripts/check-api-rpc-contract.sh"
      - "ui/src/lib/api.ts"
      - ".github/workflows/sidecar.yml"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # rustc 1.98.0 rust-lld SIGBUS'es when many large integration-test
    # binaries link in parallel (LLVM parallelFor). Cap jobs and clear the
    # repo .cargo fuse-ld=lld override so CI uses the system bfd linker.
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ripgrep jq

      - uses: dtolnay/rust-toolchain@stable

      - name: Fast sidecar gate
        run: ./scripts/sidecar-test-fast.sh
